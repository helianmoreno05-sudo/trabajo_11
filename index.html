<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 11 - Banner de Cookies</title>
    <!-- Enlace al archivo de estilos CSS -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- Contenido básico de la página -->
    <main class="contenido">
        <h1>Título de la Página</h1>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus lacinia odio vitae vestibulum vestibulum.
        </p>
        <p>Cras venenatis euismod malesuada. Nullam id dolor id nibh ultricies vehicula ut id elit.</p>
    </main>

    <!-- Ventana emergente (Popup) de Cookies -->
    <div id="cookie-popup" class="cookie-popup">
        <!-- Botón para cerrar la ventana -->
        <button id="close-btn" class="close-btn">&times;</button>

        <!-- Icono de galleta -->
        <div class="cookie-icon">🍪</div>

        <!-- Mensaje del banner -->
        <p class="cookie-text">Usamos cookies para mejorar tu experiencia de usuario.</p>

        <!-- Botón para aceptar cookies -->
        <button id="accept-btn" class="accept-btn">Me gustan las Cookies</button>
    </div>

    <!-- Enlace al archivo de JavaScript -->
    <script src="script.js"></script>
</body>

</html>
